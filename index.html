<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Weekly Quests</title>
<style>
  :root {
    --bg: #0f0f13;
    --surface: #18181f;
    --surface2: #22222c;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0eef8;
    --muted: #9592a8;
    --accent: #7c6ff7;
    --accent2: #a89ef7;
    --accent-bg: rgba(124,111,247,0.12);
    --accent-border: rgba(124,111,247,0.3);
    --gold: #e8b94b;
    --gold-bg: rgba(232,185,75,0.1);
    --danger: #e2574a;
    --success: #3db87a;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* NAV */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 2rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .nav-logo {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-gem {
    width: 28px; height: 28px;
    background: var(--accent);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }

  .nav-btn {
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; gap: 6px;
  }
  .nav-btn:hover { color: var(--text); border-color: var(--border2); background: rgba(255,255,255,0.05); }

  /* PAGES */
  .page { display: none; }
  .page.active { display: block; }

  /* ── TEAM VIEW ── */
  .team-hero {
    max-width: 720px;
    margin: 4rem auto 2rem;
    padding: 0 1.5rem;
    text-align: center;
  }
